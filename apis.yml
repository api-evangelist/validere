aid: validere
name: Validere
description: >-
  Validere is an enterprise environmental operations and emissions data
  management platform for the energy industry. Upstream, midstream, refining,
  utility, and CCUS operators use it to unify operational, measurement, and
  emissions data for regulatory and voluntary emissions reporting, methane
  management, EHS compliance, asset management, and production accounting. Its
  public REST API at api.validere.io spans the CarbonHub App API (facilities,
  equipment, flows, devices, measurements, estimation methods, records,
  workflows, and reports) and the Data Platform Source API for pushing JSON or
  file data validated against registered JSON Schemas, with ingestion tracked
  through a Transactions API.
url: https://raw.githubusercontent.com/api-evangelist/validere/refs/heads/main/apis.yml
accessModel:
  pricing: unknown
  onboarding: self-serve
  trial: false
  try_now: false
