          example:
            year_month:
              $in:
              - 202301
              - 202302
              - 202303
          allOf:
          - $ref: '#/components/schemas/EquipmentPrimaryFilterFieldsWithPrefix'
          - $ref: '#/components/schemas/FlowPrimaryFilterFieldsWithPrefix'
